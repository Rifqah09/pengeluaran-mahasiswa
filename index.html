<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Analisis Pengeluaran Mahasiswa</title>

  <style>
    body {
      font-family: Arial;
      margin: 24px;
      max-width: 800px;
    }

    input, select, button {
      padding: 8px;
      margin: 4px;
    }

    #list, #result {
      border: 1px solid #ddd;
      padding: 10px;
      margin-top: 10px;
      white-space: pre-line;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    table, th, td {
      border: 1px solid #ccc;
    }

    th, td {
      padding: 8px;
      text-align: left;
    }

    #aiImage {
      margin-top: 20px;
      border: 1px solid #ccc;
      padding: 10px;
      display: none;
      max-width: 400px;
    }
  </style>
</head>

<body>

<h2>Analisis Pengeluaran Harian Mahasiswa</h2>

<input id="nama" placeholder="Nama Pengeluaran">

<select id="kategori">
  <option value="">Pilih Kategori</option>
  <option>Makanan</option>
  <option>Transport</option>
  <option>Hiburan</option>
  <option>Belanja</option>
  <option>Lainnya</option>
</select>

<input id="jumlah" type="number" placeholder="Jumlah">

<button onclick="tambah()">Tambah</button>
<button onclick="analisis()">Analisis</button>

<h3>Total:</h3>
<p id="total">Rp 0</p>

<h3>Data:</h3>
<div id="list">Belum ada data</div>

<h3>Hasil:</h3>
<div id="result">Belum dianalisis</div>

<h3>AI Image:</h3>
<img id="aiImage">

<script>

let data = [];

function formatRupiah(angka) {
  return "Rp " + angka.toLocaleString("id-ID");
}

function render() {
  let total = 0;

  if (data.length === 0) {
    document.getElementById("list").innerHTML = "Belum ada data";
    document.getElementById("total").innerText = "Rp 0";
    return;
  }

  let html = "<table><tr><th>No</th><th>Nama</th><th>Kategori</th><th>Jumlah</th></tr>";

  data.forEach((d, i) => {
    total += d.jumlah;

    html += `
      <tr>
        <td>${i+1}</td>
        <td>${d.nama}</td>
        <td>${d.kategori}</td>
        <td>${formatRupiah(d.jumlah)}</td>
      </tr>
    `;
  });

  html += "</table>";

  document.getElementById("list").innerHTML = html;
  document.getElementById("total").innerText = formatRupiah(total);
}

function tambah() {
  const nama = document.getElementById("nama").value.trim();
  const kategori = document.getElementById("kategori").value;
  const jumlah = Number(document.getElementById("jumlah").value);

  if (!nama || !kategori || !jumlah) {
    alert("Isi semua data");
    return;
  }

  data.push({ nama, kategori, jumlah });

  document.getElementById("nama").value = "";
  document.getElementById("kategori").value = "";
  document.getElementById("jumlah").value = "";

  render();
}

async function analisis() {

  if (data.length === 0) {
    alert("Belum ada data");
    return;
  }

  let total = 0;
  let terbesar = 0;
  let kategoriTerbesar = "";

  data.forEach(d => {
    total += d.jumlah;
    if (d.jumlah > terbesar) {
      terbesar = d.jumlah;
      kategoriTerbesar = d.kategori;
    }
  });

  let status = total < 50000 ? "Hemat"
              : total <= 100000 ? "Sedang"
              : "Boros";

  const hasil = `
Total: ${formatRupiah(total)}
Kategori terbesar: ${kategoriTerbesar} (${formatRupiah(terbesar)})
Status: ${status}
  `;

  document.getElementById("result").innerText = hasil;

  try {

    const res = await fetch(
      "https://student-expense-analyzer-backend.vercel.app/api/generate-images",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ expenses: hasil })
      }
    );

    const aiData = await res.json();

    console.log(aiData);

    if (aiData.image) {
      const img = document.getElementById("aiImage");
      img.src = `data:image/png;base64,${aiData.image}`;
      img.style.display = "block";
    } else {
      alert("❌ " + (aiData.error || "AI gagal"));
    }

  } catch (err) {
    alert("❌ Tidak bisa konek ke backend");
  }
}

render();

</script>

</body>
</html>
